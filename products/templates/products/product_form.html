
{% extends "base.html" %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <h2 class="mb-4">

                {% if product %}
                    Update Product
                {% else %}
                    Add Product
                {% endif %}

            </h2>


            <form method="POST">

                {% csrf_token %}


                <div class="mb-3">

                    <label class="form-label">
                        Product Name
                    </label>

                    <input
                        type="text"
                        name="product_name"
                        class="form-control"
                        value="{{ product.product_name|default:'' }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="product_description"
                        class="form-control"
                        rows="4"
                        required
                    >{{ product.product_description|default:'' }}</textarea>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Price
                    </label>

                    <input
                        type="number"
                        name="product_price"
                        class="form-control"
                        step="0.01"
                        min="0"
                        value="{{ product.product_price|default:'' }}"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Stock
                    </label>

                    <input
                        type="number"
                        name="stock"
                        class="form-control"
                        min="0"
                        value="{{ product.stock|default:'' }}"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >

                    {% if product %}
                        Update Product
                    {% else %}
                        Create Product
                    {% endif %}

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
